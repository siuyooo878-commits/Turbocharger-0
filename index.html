function buildTimeline(){

 }

  SENT.forEach((s,i)=>{s.start=tapMarks[i];s.end=i<SENT.length-1?tapMarks[i+1]-0.15:Math.max(s.start+s.dur,(narrBuf?off+narrBuf.duration:s.start+s.dur));});

 }

 TL.scenes.forEach((s,k)=>s.end=k<TL.scenes.length-1?TL.scenes[k+1].start:total);
 TL.total=total; buildCues(); refreshUI();
}
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), lerp=(a,b,u)=>a+(b-a)*u;
const ease=u=>{u=clamp(u);return u*u*(3-2*u)}, rnd=i=>{const x=Math.sin(i*12.9898+78.233)*43758.5453;return x-Math.floor(x)};

/* ================= MATERIALS / HELPERS ================= */
const M=(c,m=0,r=.6,o={})=>new THREE.MeshStandardMaterial({color:c,metalness:m,roughness:r,...o});

function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;}
function tube(points,r,mat){return mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p))),48,r,10,false),mat);}
const dot=canvasTex(64,64,(c)=>{const g=c.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.4,'rgba(255,255,255,.6)');g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.fillRect(0,0,64,64);});
function makeFlow(points,n,color,size){
 const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));
 const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(n*3),3));
 const pts=new THREE.Points(geo,new THREE.PointsMaterial({color,size,map:dot,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,opacity:.9}));
 pts.frustumCulled=false;const v=new THREE.Vector3();
 pts.userData.update=(t,speed,jit=.025)=>{const a=geo.attributes.position.array;for(let i=0;i<n;i++){const u=((i/n+t*speed)%1+1)%1;curve.getPointAt(u,v);
  a[i*3]=v.x+(rnd(i)-.5)*jit;a[i*3+1]=v.y+(rnd(i+99)-.5)*jit;a[i*3+2]=v.z+(rnd(i+7)-.5)*jit;}geo.attributes.position.needsUpdate=true;};
 return pts;
}

/* ================= PROCEDURAL: ENGINE ================= */
function makeEngine(){
 const g=new THREE.Group();
 const block=mesh(new THREE.BoxGeometry(.62,.36,.56),IRON);block.position.y=.28;g.add(block);
 for(const s of[-1,1]){const bank=grp(mesh(new THREE.BoxGeometry(.2,.22,.54),ALU));bank.position.set(s*.2,.54,0);bank.rotation.z=-s*.5;g.add(bank);
  const cover=mesh(new THREE.BoxGeometry(.16,.06,.5),RED);cover.position.set(s*.27,.67,0);cover.rotation.z=-s*.5;g.add(cover);
  for(let k=0;k<5;k++){const p=tube([[s*.32,.5,-.2+k*.1],[s*.42,.38,-.2+k*.1],[s*.44,.2,-.1+k*.03]],.022,HOT);g.add(p);} }
 const plenum=mesh(new THREE.CylinderGeometry(.09,.09,.5,20),ALU);plenum.rotation.x=Math.PI/2;plenum.position.y=.72;g.add(plenum);
 const pul=mesh(new THREE.CylinderGeometry(.09,.09,.04,24),DARK);pul.rotation.x=Math.PI/2;pul.position.set(0,.3,.3);g.add(pul);
 const pan=mesh(new THREE.BoxGeometry(.5,.12,.5),DARK);pan.position.y=.07;g.add(pan);
 const eye=mesh(new THREE.TorusGeometry(.05,.012,8,20),CHROME);eye.position.set(0,.84,0);g.add(eye);g.userData.eye=eye;
 return g;
}
/* ================= PROCEDURAL: PEOPLE ================= */
function makePerson(c){
 const s=M(c.skin,0,.55),sh=M(c.shirt,0,.85),pa=M(c.pants,0,.9),hm=M(c.hair,0,.95),shoe=M(0x151515,.1,.5),wht=M(0xffffff,0,.3),blk=M(0x111111,0,.3);
 const g=new THREE.Group(),hips=new THREE.Group();hips.position.y=.95;g.add(hips);
 const torso=mesh(new THREE.CapsuleGeometry(.19,.4,6,14),sh);torso.position.y=.33;torso.scale.z=.75;hips.add(torso);
 const neck=new THREE.Group();neck.position.y=.66;hips.add(neck);
 const head=new THREE.Group();head.position.y=.14;neck.add(head);
 head.add(mesh(new THREE.SphereGeometry(.13,24,18),s));
 const hair=mesh(new THREE.SphereGeometry(.137,24,12,0,Math.PI*2,0,Math.PI*.5),hm);hair.rotation.x=-.25;hair.position.y=.015;head.add(hair);
 const nose=mesh(new THREE.SphereGeometry(.022,10,8),s);nose.position.set(0,-.005,.13);head.add(nose);
 const eyes=[],brows=[];for(const x of[-.045,.045]){const e=mesh(new THREE.SphereGeometry(.02,10,8),wht,false);e.position.set(x,.03,.115);const p=mesh(new THREE.SphereGeometry(.01,8,6),blk,false);p.position.z=.014;e.add(p);head.add(e);eyes.push(e);
  const b=mesh(new THREE.BoxGeometry(.045,.01,.01),hm,false);b.position.set(x,.068,.122);head.add(b);brows.push(b);}
 const mouth=mesh(new THREE.TorusGeometry(.035,.006,6,16,Math.PI),M(0x5a2222),false);mouth.position.set(0,-.055,.118);mouth.rotation.z=Math.PI;head.add(mouth);
 const limb=(len,r,m)=>{const p=new THREE.Group(),x=mesh(new THREE.CapsuleGeometry(r,len,4,10),m);x.position.y=-len/2;p.add(x);return p;};
 const arms=[],legs=[];
 for(const sd of[-1,1]){const sh_=limb(.26,.055,sh);sh_.position.set(sd*.25,.56,0);hips.add(sh_);const el=limb(.24,.045,s);el.position.y=-.3;sh_.add(el);
  const hand=mesh(new THREE.SphereGeometry(.05,12,10),s);hand.position.y=-.3;el.add(hand);arms.push({sh:sh_,el,hand});
  const hp=limb(.36,.075,pa);hp.position.set(sd*.1,0,0);hips.add(hp);const kn=limb(.36,.06,pa);kn.position.y=-.43;hp.add(kn);
  const f=mesh(new THREE.BoxGeometry(.1,.07,.24),shoe);f.position.set(0,-.43,.05);kn.add(f);legs.push({hp,kn});}
 if(c.coverall){const bib=mesh(new THREE.BoxGeometry(.3,.25,.02),M(c.coverall,0,.9));bib.position.set(0,.3,.15);hips.add(bib);}
 return {g,hips,neck,head,arms,legs,eyes,brows,mouth,torso};
}
function pose(p,o={}){
 const w=o.walk??0,ph=o.phase??0,sw=Math.sin(ph)*.55*w;

 const aL=o.armL??[-sw*.6,.1,0],aR=o.armR??[sw*.6,-.1,0];
 p.arms[0].sh.rotation.set(aL[0],0,-aL[1]-.08);p.arms[0].el.rotation.x=aL[2];p.arms[1].sh.rotation.set(aR[0],0,-aR[1]+.08);p.arms[1].el.rotation.x=aR[2];
 p.hips.rotation.x=o.lean??0;p.neck.rotation.set(o.nod??0,o.look??0,o.tilt??0);
 const br=o.brow??0;p.brows[0].rotation.z=br;p.brows[1].rotation.z=-br;p.brows.forEach(b=>b.position.y=.068+(o.browUp??0)*.02);

 // dyno rollers

function normalize(root,len,horizontal=true){
 const w=new THREE.Group();w.add(root);root.updateMatrixWorld(true);let b=new THREE.Box3().setFromObject(root),s=b.getSize(new THREE.Vector3());
 if(horizontal&&s.x>s.z){root.rotation.y=Math.PI/2;root.updateMatrixWorld(true);b.setFromObject(root);s=b.getSize(new THREE.Vector3());}
 const k=len/(horizontal?Math.max(s.x,s.z):Math.max(s.x,s.y,s.z));root.scale.multiplyScalar(k);root.updateMatrixWorld(true);b.setFromObject(root);
 const c=b.getCenter(new THREE.Vector3());root.position.x-=c.x;root.position.z-=c.z;root.position.y-=b.min.y;
 root.traverse(o=>{if(o.isMesh){o.castShadow=o.receiveShadow=true;if(o.material)o.material.envMapIntensity=1;}});return w;}

function shot(keys,u){ // keys:[[u,pos,look,fov?],...] smooth interpolation, deterministic

  const env=(x)=>{const tl=skip+x;let v=q.gain;if(q.fi)v*=clamp(tl/q.fi);if(q.fo)v*=clamp((q.dur-tl)/q.fo);return v;};
